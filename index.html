<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de compras</title>

    <link rel="stylesheet" href="assets/styles/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <img src="assets/image/logo.svg" alt="Logo">
        </div>
    </header>
    <main>
        <div>
            <a>← Voltar</a>
            <h1>Compras da semana</h1>
        </div>
        <form>
            <input type="text" name="" id="" placeholder="Adicione um novo item">
            <button>Adicionar item</button>
        </form>
        <div>
            <div>
                <input type="checkbox" name="" id="">
                <p>Pão de forma</p>
                <img src="./assets/image/trash_icon.svg" alt="">
            </div>
            <div>
                <input type="checkbox" name="" id="">
                <p>Café preto</p>
                <img src="./assets/image/trash_icon.svg" alt="">
            </div>
            <div>
                <input type="checkbox" name="" id="">
                <p>Suco de laranja</p>
                <img src="./assets/image/trash_icon.svg" alt="">
            </div>
            <div>
                <input type="checkbox" name="" id="">
                <p>Bolacha</p>
                <img src="./assets/image/trash_icon.svg" alt="">
            </div>
        </div>

        <div>
            <img src="./assets/image/waring_icon.svg" alt="">
            <p>O item foi removido da lista</p>
            <img src="./assets/image/delete_icon.svg" alt="">
        </div>
    </main>
</body>

</html>
