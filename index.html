<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de compras</title>

    <link rel="stylesheet" href="assets/styles/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="page-container">
        <header>
            <div class="headder-container">
                <img src="assets/image/logo.svg" alt="Logo">
            </div>
        </header>
        <main>
            <div class="main-container">
                <div class="title-container">
                    <a href="/">← Voltar</a>
                    <h1>Compras da semana</h1>
                </div>
                <form class="form-container">
                    <input type="text" name="item" id="new-item" placeholder="Adicione um novo item" required>
                    <button>Adicionar item</button>
                </form>
                <div class="list-container">
                    <ul class="list">
                        <li class="list-item">
                            <label>
                                <input type="checkbox">
                                <span>Pão de forma</span>
                            </label>
                            <button><img src="./assets/image/trash_icon.svg"></button>
                        </li>
                        <li class="list-item">
                            <label>
                                <input type="checkbox">
                                <span>Café preto</span>
                            </label>
                            <button><img src="./assets/image/trash_icon.svg"></button>
                        </li>
                        <li class="list-item">
                            <label>
                                <input type="checkbox">
                                <span>Suco de laranja</span>
                            </label>
                            <button><img src="./assets/image/trash_icon.svg"></button>
                        </li>
                        <li class="list-item">
                            <label>
                                <input type="checkbox">
                                <span>Bolacha</span>
                            </label>
                            <button><img src="./assets/image/trash_icon.svg"></button>
                        </li>
                    </ul>
                </div>

                <!--
                <div id="remove-notification">
                    <img src="./assets/image/waring_icon.svg" alt="">
                    <span>O item foi removido da lista</span>
                </div>
                -->
            </div>
        </main>
    </div>
    <script src="./assets/js/script.js"></script>
</body>

</html>
